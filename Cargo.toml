[package]
name = "bevy-rabbitmq"
version = "0.1.0"
edition = "2021"
description = "A Bevy plugin for integrating RabbitMQ message queue with Bevy ECS"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.14", default-features = false }
lapin = "2.3"
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
async-channel = "2.1"

[dev-dependencies]
bevy = { version = "0.14" }
